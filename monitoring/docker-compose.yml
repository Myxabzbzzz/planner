# Мониторинг локального стека planner: Prometheus + Grafana.
# Сначала `supabase start` (создаёт сеть supabase_network_planner), потом:
#   docker compose -f monitoring/docker-compose.yml up -d
# Grafana — http://localhost:3300 (без входа), Prometheus — http://localhost:9090.
# Порты слушают только 127.0.0.1: из Wi-Fi сети их не видно.
name: planner-monitoring

services:
  # Прокси перед API: k6 и dev-миниапп ходят сюда, он считает запросы, ошибки и время ответа.
  metrics-proxy:
    image: denoland/deno:alpine-2.4.3
    command: ["run", "--allow-net", "--allow-env", "/app/metrics_proxy.ts"]
    environment:
      UPSTREAM: http://supabase_kong_planner:8000/functions/v1/api
    volumes:
      - ./proxy:/app:ro
    ports:
      - "127.0.0.1:8787:8787"
    networks: [supabase]
    restart: unless-stopped

  # CPU и память каждого контейнера (edge runtime, Postgres, PostgREST, Kong) из Docker API.
  # cAdvisor тут не годится: на Docker Desktop с containerd он не узнаёт контейнеры.
  docker-stats:
    image: denoland/deno:alpine-2.4.3
    command: ["run", "--allow-net", "--allow-env", "--allow-read=/var/run/docker.sock", "--allow-write=/var/run/docker.sock", "/app/docker_stats.ts"]
    volumes:
      - ./proxy:/app:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [supabase]
    restart: unless-stopped

  # Postgres изнутри: соединения, транзакции, блокировки.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:postgres@supabase_db_planner:5432/postgres?sslmode=disable
    networks: [supabase]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      # сюда k6 пишет число виртуальных пользователей — чтобы оно было на тех же графиках
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [supabase]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      # локальная машина и только 127.0.0.1 — вход не нужен
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/planner.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3300:3000"
    networks: [supabase]
    depends_on: [prometheus]
    restart: unless-stopped

networks:
  supabase:
    name: supabase_network_planner
    external: true

volumes:
  prometheus-data:
  grafana-data:
