[project]
name = "planner-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "supabase>=2.10",
  "python-dotenv>=1.0",
  "mlx-whisper>=0.4",
  "laya>=0.3.22",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["planner_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
